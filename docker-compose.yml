# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: aiba-db
    environment:
      POSTGRES_USER: aiba
      POSTGRES_PASSWORD: aiba
      POSTGRES_DB: aiba
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - aiba-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiba"]
      interval: 2s
      retries: 20
    restart: unless-stopped
volumes:
  aiba-pg:
